<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StyleForge · Stage 2 Design Chooser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;800&family=Sora:wght@700&family=Plus+Jakarta+Sans:wght@400;500;700&family=Manrope:wght@700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sf-primary: #00B7FF;
      --sf-secondary: #FF2EC4;
      --sf-accent: #7C5CFF;
      --sf-bg: #0b0f18;
      --sf-surface: #131a28;
      --sf-text: #eef3ff;
      --sf-muted: #95a3cc;
      --sf-border: rgba(126,152,229,0.3);
      --sf-primary-gradient: linear-gradient(120deg, #00B7FF 0%, #FF2EC4 100%);
      --sf-bg-mesh: radial-gradient(circle at 8% 15%, rgba(0,183,255,.35), transparent 38%), radial-gradient(circle at 84% 20%, rgba(255,46,196,.25), transparent 35%), radial-gradient(circle at 50% 88%, rgba(124,92,255,.28), transparent 40%);
      --sf-font-heading: 'Space Grotesk', sans-serif;
      --sf-font-body: 'Inter', sans-serif;
      --sf-heading-weight: 800;
      --sf-card-radius: 18px;
      --sf-btn-radius: 12px;
      --sf-shadow: 0 12px 36px rgba(0,0,0,0.35);
      --sf-anim-speed: 220ms;
      --sf-spacing: 1;
      --sf-grid-gap: 18px;
      --sf-card-padding: 24px;
      --tab-glow: rgba(0,183,255,.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sf-font-body);
      color: var(--sf-text);
      background: linear-gradient(180deg, #070c16, #0d1323 40%, #0c1220 100%);
      min-height: 100vh;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px 18px 48px;
      position: relative;
    }

    .tabs-wrap {
      position: sticky;
      top: 8px;
      z-index: 40;
      backdrop-filter: blur(10px);
      background: rgba(7,10,18,.78);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 10px 28px rgba(0,0,0,.32);
    }

    .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .tab {
      border: 0;
      background: transparent;
      color: #d6e2ff;
      padding: 12px 10px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .01em;
      cursor: pointer;
      position: relative;
      transition: all .2s ease;
    }
    .tab:hover { background: rgba(255,255,255,.05); color: #fff; }
    .tab.active {
      background: rgba(255,255,255,.08);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
    }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 14px; right: 14px; bottom: 4px;
      height: 3px;
      border-radius: 4px;
      background: var(--sf-primary-gradient);
      box-shadow: 0 0 18px var(--tab-glow);
    }

    .preview-stage { position: relative; margin-top: 18px; min-height: 740px; }
    .preview-panel {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 300ms ease, transform 300ms ease;
    }
    .preview-panel.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      z-index: 2;
    }

    .composition {
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--sf-border);
      background: var(--sf-bg);
      box-shadow: 0 16px 42px rgba(0,0,0,.28);
      position: relative;
      isolation: isolate;
    }
    .composition::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--sf-bg-mesh);
      background-size: 170% 170%;
      animation: meshMove 14s ease-in-out infinite alternate;
      opacity: .95;
      z-index: 0;
    }
    .composition::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent 30%, rgba(0,0,0,.12));
      z-index: 0;
      pointer-events: none;
    }

    .content { position: relative; z-index: 1; padding: calc(28px * var(--sf-spacing)); }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 22px;
      align-items: center;
      margin-bottom: 18px;
    }
    .eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--sf-muted);
      margin-bottom: 10px;
      font-weight: 700;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 58px);
      line-height: .98;
      font-family: var(--sf-font-heading);
      font-weight: var(--sf-heading-weight);
      color: var(--sf-text);
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 14px 0 20px;
      color: var(--sf-muted);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.5;
      max-width: 60ch;
    }

    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      border: 1px solid transparent;
      border-radius: var(--sf-btn-radius);
      padding: 12px 16px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform var(--sf-anim-speed) ease, box-shadow var(--sf-anim-speed) ease, filter var(--sf-anim-speed) ease, background var(--sf-anim-speed) ease;
      color: var(--sf-text);
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: var(--sf-primary-gradient);
      color: #fff;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--sf-primary) 36%, transparent);
    }
    .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn-secondary {
      background: color-mix(in srgb, var(--sf-surface) 85%, white 15%);
      border-color: var(--sf-border);
      color: var(--sf-text);
    }
    .btn-secondary:hover { background: color-mix(in srgb, var(--sf-surface) 76%, white 24%); }
    .btn-ghost {
      background: color-mix(in srgb, var(--sf-surface) 45%, transparent);
      border: 1.5px solid color-mix(in srgb, var(--sf-text) 38%, transparent);
      color: var(--sf-text);
    }
    .btn-ghost:hover { background: color-mix(in srgb, var(--sf-surface) 70%, transparent); border-color: color-mix(in srgb, var(--sf-text) 55%, transparent); }

    .device {
      width: min(100%, 310px);
      margin-left: auto;
      background: color-mix(in srgb, var(--sf-surface) 88%, black 12%);
      border: 1px solid var(--sf-border);
      border-radius: 28px;
      padding: 14px;
      box-shadow: var(--sf-shadow);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--sf-grid-gap);
      margin-bottom: 18px;
    }
    .card {
      background: color-mix(in srgb, var(--sf-surface) 92%, white 8%);
      border: 1px solid var(--sf-border);
      border-radius: var(--sf-card-radius);
      padding: var(--sf-card-padding);
      box-shadow: var(--sf-shadow);
      transition: transform var(--sf-anim-speed) ease, box-shadow var(--sf-anim-speed) ease, border-color var(--sf-anim-speed) ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--sf-primary) 35%, var(--sf-border));
      box-shadow: 0 14px 28px color-mix(in srgb, var(--sf-primary) 17%, rgba(0,0,0,.2));
    }
    .icon {
      width: 28px; height: 28px;
      color: var(--sf-primary);
      margin-bottom: 12px;
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 18px;
      font-family: var(--sf-font-heading);
      font-weight: min(calc(var(--sf-heading-weight) - 100), 700);
      color: var(--sf-text);
    }
    .card p {
      margin: 0;
      color: var(--sf-muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .component-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: color-mix(in srgb, var(--sf-surface) 88%, white 12%);
      border: 1px solid var(--sf-border);
      border-radius: calc(var(--sf-card-radius) - 4px);
      padding: 12px;
      margin-bottom: 20px;
    }
    .mini-input {
      border: 1px solid var(--sf-border);
      background: color-mix(in srgb, var(--sf-bg) 58%, white 42%);
      color: var(--sf-text);
      border-radius: 10px;
      padding: 10px 12px;
      min-width: 210px;
      font: inherit;
    }
    .toggle {
      width: 48px; height: 28px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--sf-secondary) 38%, #6d7485 62%);
      position: relative;
      border: 1px solid var(--sf-border);
    }
    .toggle::after {
      content: "";
      position: absolute;
      top: 3px; left: 22px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }

    .swatches { display: flex; gap: 8px; align-items: center; }
    .swatch {
      display: grid;
      gap: 5px;
      font-size: 11px;
      color: var(--sf-muted);
      text-align: center;
      min-width: 74px;
    }
    .swatch i {
      width: 100%;
      height: 18px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.12);
      background: var(--color);
      display: block;
    }

    .pick-wrap { text-align: center; padding: 18px 0 8px; }
    .like-btn {
      border: 0;
      background: var(--sf-primary-gradient);
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: .02em;
      padding: 18px 42px;
      border-radius: calc(var(--sf-btn-radius) + 8px);
      cursor: pointer;
      box-shadow: 0 16px 34px color-mix(in srgb, var(--sf-primary) 50%, transparent), 0 0 24px color-mix(in srgb, var(--sf-secondary) 30%, transparent);
      transition: transform .2s ease, box-shadow .2s ease;
      animation: likeGlow 2.2s ease-in-out infinite;
    }
    .like-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 20px 44px color-mix(in srgb, var(--sf-primary) 50%, transparent);
    }
    @keyframes likeGlow {
      0%,100% { box-shadow: 0 16px 34px color-mix(in srgb, var(--sf-primary) 45%, transparent), 0 0 0 0px transparent; }
      50% { box-shadow: 0 20px 52px color-mix(in srgb, var(--sf-primary) 55%, transparent), 0 0 0 6px color-mix(in srgb, var(--sf-primary) 16%, transparent), 0 0 28px color-mix(in srgb, var(--sf-secondary) 30%, transparent); }
    }

    .mixer {
      position: fixed;
      right: 14px;
      top: 88px;
      width: min(320px, calc(100vw - 24px));
      background: rgba(12,16,28,.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 16px;
      box-shadow: 0 14px 40px rgba(0,0,0,.34);
      color: #eef2ff;
      z-index: 65;
      transform: translateY(8px) scale(.98);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .mixer.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }
    .mixer-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .mixer h3 { margin: 0; font-size: 15px; }
    .collapse {
      border: 0; background: transparent; color: #fff; font-weight: 700; cursor: pointer;
      padding: 4px 6px; border-radius: 8px;
    }
    .mixer-body { padding: 12px 14px 14px; display: grid; gap: 9px; }
    .mixer.collapsed .mixer-body { display: none; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 12px; color: #c8d4ee; font-weight: 700; letter-spacing: .02em; }
    .field select {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: #fff;
      padding: 10px 11px;
      font: 600 14px Inter, sans-serif;
    }
    .summary {
      border-top: 1px solid rgba(255,255,255,.12);
      margin-top: 3px;
      padding-top: 9px;
      font-size: 12px;
      line-height: 1.4;
      color: #dce7ff;
    }
    .copy {
      width: 100%;
      border: 0;
      border-radius: 10px;
      margin-top: 8px;
      background: linear-gradient(120deg, #5d8dff, #8b5cff);
      color: #fff;
      padding: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 1040px) {
      .mixer { position: sticky; top: 74px; right: auto; margin-top: 14px; width: 100%; }
      .preview-stage { min-height: auto; }
      .preview-panel { position: relative; }
      .hero { grid-template-columns: 1fr; }
      .device { margin: 0; }
      .features { grid-template-columns: 1fr; }
      .tabs { grid-template-columns: 1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: 0ms !important;
        scroll-behavior: auto !important;
      }
    }

    .preview-panel[data-key="midnight"] h1 {
      background: linear-gradient(135deg, #F0D98A 0%, #D4AF37 40%, #B8962E 70%, #F0D98A 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: goldShimmer 4s linear infinite;
    }
    @keyframes goldShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    @keyframes meshMove {
      0% { background-position: 0% 35%, 80% 10%, 45% 90%; }
      100% { background-position: 14% 22%, 100% 40%, 20% 82%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="tabs-wrap">
      <div class="tabs" id="tabs"></div>
    </div>

    <section class="preview-stage" id="previewStage"></section>

    <aside class="mixer" id="mixer">
      <div class="mixer-head">
        <h3>Customize Mix</h3>
        <button class="collapse" id="collapseBtn">Collapse</button>
      </div>
      <div class="mixer-body">
        <div class="field"><label for="colors">Colors</label><select id="colors"></select></div>
        <div class="field"><label for="typography">Typography</label><select id="typography"></select></div>
        <div class="field"><label for="vibe">Vibe</label><select id="vibe"></select></div>
        <div class="field"><label for="layout">Layout</label><select id="layout"></select></div>
        <div class="summary" id="summary"></div>
        <button class="copy" id="copyTokens">📋 Copy Design Tokens</button>
      </div>
    </aside>
  </div>

  <script>
    const directions = {
      neon: {
        name: 'Neon Creator', subtitle: 'Go from idea to published video in under 5 minutes. Pick a template, customize your brand, export for TikTok or Reels — then list your editing skills and start earning.',
        colors: { '--sf-primary':'#00B7FF','--sf-secondary':'#FF2EC4','--sf-accent':'#7C5CFF','--sf-bg':'#0b0f18','--sf-surface':'#131a28','--sf-text':'#eef3ff','--sf-muted':'#95a3cc','--sf-border':'rgba(126,152,229,0.30)','--sf-primary-gradient':'linear-gradient(120deg, #00B7FF 0%, #FF2EC4 100%)','--sf-bg-mesh':'radial-gradient(circle at 8% 15%, rgba(0,183,255,.35), transparent 38%), radial-gradient(circle at 84% 20%, rgba(255,46,196,.25), transparent 35%), radial-gradient(circle at 50% 88%, rgba(124,92,255,.28), transparent 40%)' },
        typography: { '--sf-font-heading':"'Space Grotesk', sans-serif",'--sf-font-body':"'Inter', sans-serif",'--sf-heading-weight':'800' },
        vibe: { '--sf-card-radius':'18px','--sf-btn-radius':'12px','--sf-shadow':'0 12px 36px rgba(0,0,0,0.35)','--sf-anim-speed':'220ms' },
        layout: { '--sf-spacing':'1','--sf-grid-gap':'18px','--sf-card-padding':'24px' },
        tabGlow:'rgba(0,183,255,.45)'
      },
      clean: {
        name: 'Clean Studio', subtitle: 'Your video production workflow, simplified. Find templates, hire talent, and track what\'s working — in a workspace that stays out of your way.',
        colors: { '--sf-primary':'#4F8CFF','--sf-secondary':'#93B4FF','--sf-accent':'#2F6FE4','--sf-bg':'#f5f8fc','--sf-surface':'#ffffff','--sf-text':'#0f172a','--sf-muted':'#51607a','--sf-border':'rgba(17,56,121,0.14)','--sf-primary-gradient':'linear-gradient(120deg, #4F8CFF 0%, #2F6FE4 100%)','--sf-bg-mesh':'radial-gradient(circle at 12% 18%, rgba(79,140,255,.18), transparent 38%), radial-gradient(circle at 82% 16%, rgba(147,180,255,.28), transparent 35%), radial-gradient(circle at 56% 90%, rgba(47,111,228,.14), transparent 38%)' },
        typography: { '--sf-font-heading':"'Manrope', sans-serif",'--sf-font-body':"'Inter', sans-serif",'--sf-heading-weight':'800' },
        vibe: { '--sf-card-radius':'14px','--sf-btn-radius':'10px','--sf-shadow':'0 8px 20px rgba(26,71,145,0.10)','--sf-anim-speed':'190ms' },
        layout: { '--sf-spacing':'1','--sf-grid-gap':'16px','--sf-card-padding':'22px' },
        tabGlow:'rgba(79,140,255,.38)'
      },
      sunset: {
        name: 'Sunset Vibes', subtitle: 'Make content that feels as good as it performs. A warm, inviting space for creators who want their brand to feel personal — not corporate.',
        colors: { '--sf-primary':'#FF6F61','--sf-secondary':'#FFBE55','--sf-accent':'#FFA63A','--sf-bg':'#fff5ee','--sf-surface':'#ffffff','--sf-text':'#302018','--sf-muted':'#7a5d4d','--sf-border':'rgba(164,79,56,0.18)','--sf-primary-gradient':'linear-gradient(120deg, #FF6F61 0%, #FFBE55 100%)','--sf-bg-mesh':'radial-gradient(circle at 12% 20%, rgba(255,111,97,.22), transparent 38%), radial-gradient(circle at 85% 18%, rgba(255,190,85,.30), transparent 34%), radial-gradient(circle at 56% 88%, rgba(255,166,58,.20), transparent 38%)' },
        typography: { '--sf-font-heading':"'Sora', sans-serif",'--sf-font-body':"'Plus Jakarta Sans', sans-serif",'--sf-heading-weight':'700' },
        vibe: { '--sf-card-radius':'24px','--sf-btn-radius':'999px','--sf-shadow':'0 12px 28px rgba(168,91,47,0.14)','--sf-anim-speed':'210ms' },
        layout: { '--sf-spacing':'1.03','--sf-grid-gap':'18px','--sf-card-padding':'24px' },
        tabGlow:'rgba(255,111,97,.35)'
      },
      midnight: {
        name: 'Midnight Pro', subtitle: 'For agencies and studios who deliver premium video at scale. Your clients expect excellence — your platform should reflect it.',
        colors: { '--sf-primary':'#D4AF37','--sf-secondary':'#17233f','--sf-accent':'#F0D98A','--sf-bg':'#0a1020','--sf-surface':'#101a30','--sf-text':'#f7f0dc','--sf-muted':'#bcae86','--sf-border':'rgba(240,217,138,0.33)','--sf-primary-gradient':'linear-gradient(120deg, #D4AF37 0%, #B8962E 52%, #8A6A1F 100%)','--sf-bg-mesh':'radial-gradient(circle at 11% 18%, rgba(212,175,55,.18), transparent 36%), radial-gradient(circle at 86% 20%, rgba(240,217,138,.12), transparent 32%), radial-gradient(circle at 56% 89%, rgba(23,35,63,.55), transparent 40%)' },
        typography: { '--sf-font-heading':"'Playfair Display', serif",'--sf-font-body':"'Inter', sans-serif",'--sf-heading-weight':'700' },
        vibe: { '--sf-card-radius':'4px','--sf-btn-radius':'4px','--sf-shadow':'0 12px 34px rgba(2,5,12,.42)','--sf-anim-speed':'180ms' },
        layout: { '--sf-spacing':'1','--sf-grid-gap':'16px','--sf-card-padding':'22px' },
        tabGlow:'rgba(212,175,55,.43)'
      },
      fresh: {
        name: 'Fresh Pop', subtitle: 'Ship video campaigns at startup speed. No fluff, no clutter — just the tools you need to create, publish, and sell your video skills.',
        colors: { '--sf-primary':'#111111','--sf-secondary':'#B7FF00','--sf-accent':'#5F8F00','--sf-bg':'#ffffff','--sf-surface':'#ffffff','--sf-text':'#111111','--sf-muted':'#4b4b4b','--sf-border':'rgba(17,17,17,0.36)','--sf-primary-gradient':'linear-gradient(120deg, #111111 0%, #111111 100%)','--sf-bg-mesh':'radial-gradient(circle at 11% 14%, rgba(17,17,17,.04), transparent 35%), radial-gradient(circle at 88% 18%, rgba(183,255,0,.20), transparent 28%), radial-gradient(circle at 55% 85%, rgba(95,143,0,.11), transparent 36%)' },
        typography: { '--sf-font-heading':"'Manrope', sans-serif",'--sf-font-body':"'Inter', sans-serif",'--sf-heading-weight':'800' },
        vibe: { '--sf-card-radius':'8px','--sf-btn-radius':'8px','--sf-shadow':'0 8px 24px rgba(10,10,10,0.08)','--sf-anim-speed':'170ms' },
        layout: { '--sf-spacing':'1','--sf-grid-gap':'14px','--sf-card-padding':'20px' },
        tabGlow:'rgba(183,255,0,.44)'
      }
    };

    const order = ['neon','clean','sunset','midnight','fresh'];
    const state = { active: 'neon', base: null, colors: 'neon', typography: 'neon', vibe: 'neon', layout: 'neon', panelVisible: false, collapsed: false };

    const tabsEl = document.getElementById('tabs');
    const stageEl = document.getElementById('previewStage');
    const mixer = document.getElementById('mixer');
    const summary = document.getElementById('summary');

    function icon(kind) {
      if (kind === 'video') return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>`;
      if (kind === 'people') return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M17 14a4 4 0 014 4v3"/></svg>`;
      return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16l4-6 4 3 5-7"/></svg>`;
    }

    function makePanel(key) {
      const d = directions[key];
      const panel = document.createElement('article');
      panel.className = `preview-panel${key === state.active ? ' active' : ''}`;
      panel.dataset.key = key;
      panel.innerHTML = `
        <div class="composition">
          <div class="content">
            <div class="hero">
              <div>
                <div class="eyebrow">${d.name} Direction</div>
                <h1>ContentForge</h1>
                <p class="subtitle">${d.subtitle}</p>
                <div class="hero-actions">
                  <button class="btn btn-primary">Launch Campaign</button>
                  <button class="btn btn-secondary customize">Customize →</button>
                </div>
              </div>
              <div class="device">
                <svg viewBox="0 0 280 540" width="100%" role="img" aria-label="Device mockup preview" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="grad-${key}" x1="0" x2="1">
                      <stop offset="0%" stop-color="var(--sf-primary)"/>
                      <stop offset="100%" stop-color="var(--sf-secondary)"/>
                    </linearGradient>
                  </defs>
                  <rect x="8" y="8" width="264" height="524" rx="40" fill="color-mix(in srgb, var(--sf-bg) 88%, black 12%)" stroke="var(--sf-border)"/>
                  <rect x="22" y="42" width="236" height="458" rx="28" fill="var(--sf-surface)" />
                  <rect x="102" y="20" width="76" height="7" rx="4" fill="var(--sf-border)"/>
                  <!-- Hero banner -->
                  <rect x="36" y="62" width="208" height="78" rx="14" fill="url(#grad-${key})" opacity="0.92"/>
                  <rect x="48" y="74" width="96" height="9" rx="4" fill="rgba(255,255,255,.9)"/>
                  <rect x="48" y="88" width="142" height="7" rx="3" fill="rgba(255,255,255,.55)"/>
                  <rect x="48" y="102" width="72" height="7" rx="3" fill="rgba(255,255,255,.55)"/>
                  <rect x="48" y="118" width="52" height="14" rx="7" fill="rgba(255,255,255,.9)"/>
                  <!-- Tab bar -->
                  <rect x="36" y="150" width="208" height="28" rx="8" fill="color-mix(in srgb, var(--sf-bg) 12%, var(--sf-surface))" stroke="var(--sf-border)"/>
                  <rect x="42" y="155" width="44" height="18" rx="6" fill="var(--sf-primary)" opacity=".8"/>
                  <rect x="90" y="158" width="32" height="12" rx="4" fill="var(--sf-muted)" opacity=".3"/>
                  <rect x="128" y="158" width="32" height="12" rx="4" fill="var(--sf-muted)" opacity=".3"/>
                  <rect x="166" y="158" width="32" height="12" rx="4" fill="var(--sf-muted)" opacity=".3"/>
                  <!-- Video template cards -->
                  <rect x="36" y="188" width="100" height="68" rx="10" fill="color-mix(in srgb, var(--sf-secondary) 25%, var(--sf-surface))" stroke="var(--sf-border)"/>
                  <polygon points="70,210 70,234 88,222" fill="rgba(255,255,255,.7)"/>
                  <rect x="44" y="244" width="56" height="5" rx="2" fill="var(--sf-text)" opacity=".5"/>
                  <rect x="144" y="188" width="100" height="68" rx="10" fill="color-mix(in srgb, var(--sf-primary) 20%, var(--sf-surface))" stroke="var(--sf-border)"/>
                  <polygon points="178,210 178,234 196,222" fill="rgba(255,255,255,.7)"/>
                  <rect x="152" y="244" width="56" height="5" rx="2" fill="var(--sf-text)" opacity=".5"/>
                  <!-- Analytics chart -->
                  <rect x="36" y="268" width="208" height="74" rx="12" fill="color-mix(in srgb, var(--sf-bg) 8%, var(--sf-surface))" stroke="var(--sf-border)"/>
                  <rect x="44" y="276" width="60" height="6" rx="3" fill="var(--sf-text)" opacity=".5"/>
                  <path d="M48 320l28-16 24 8 32-22 24 6 38-18" stroke="var(--sf-primary)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                  <path d="M48 320l28-16 24 8 32-22 24 6 38-18 v28 H48z" fill="var(--sf-primary)" opacity=".12"/>
                  <!-- Creator profile cards -->
                  <rect x="36" y="354" width="208" height="58" rx="12" fill="color-mix(in srgb, var(--sf-bg) 6%, var(--sf-surface))" stroke="var(--sf-border)"/>
                  <circle cx="58" cy="378" r="12" fill="var(--sf-secondary)" opacity=".7"/>
                  <rect x="76" y="370" width="80" height="7" rx="3" fill="var(--sf-text)" opacity=".65"/>
                  <rect x="76" y="382" width="56" height="5" rx="2" fill="var(--sf-muted)" opacity=".45"/>
                  <rect x="76" y="393" width="32" height="12" rx="6" fill="var(--sf-primary)" opacity=".6"/>
                  <rect x="36" y="420" width="208" height="58" rx="12" fill="color-mix(in srgb, var(--sf-bg) 6%, var(--sf-surface))" stroke="var(--sf-border)"/>
                  <circle cx="58" cy="444" r="12" fill="var(--sf-accent)" opacity=".7"/>
                  <rect x="76" y="436" width="94" height="7" rx="3" fill="var(--sf-text)" opacity=".65"/>
                  <rect x="76" y="448" width="68" height="5" rx="2" fill="var(--sf-muted)" opacity=".45"/>
                  <rect x="76" y="459" width="32" height="12" rx="6" fill="var(--sf-primary)" opacity=".6"/>
                </svg>
              </div>
            </div>

            <div class="features">
              <article class="card">${icon('video')}<h3>Video Templates</h3><p>Pick a format, customize your brand, export for TikTok, Reels, or Shorts — ready to post in under 5 minutes.</p></article>
              <article class="card">${icon('people')}<h3>Talent Marketplace</h3><p>Browse vetted editors, motion designers, and scriptwriters. Send a brief, get deliverables, pay securely — all in one place.</p></article>
              <article class="card">${icon('chart')}<h3>Analytics Dashboard</h3><p>See which videos drive sales, which creators deliver ROI, and where to double down — with real-time data, not guesswork.</p></article>
            </div>

            <div class="component-strip">
              <button class="btn btn-primary">Primary</button>
              <button class="btn btn-secondary">Secondary</button>
              <button class="btn btn-ghost">Ghost</button>
              <input class="mini-input" value="Brief: product launch Q2" aria-label="Sample input" />
              <div class="toggle" aria-hidden="true"></div>
              <div class="swatches">
                <span class="swatch"><i style="--color:var(--sf-primary)"></i><b>Primary</b><span data-token="--sf-primary"></span></span>
                <span class="swatch"><i style="--color:var(--sf-secondary)"></i><b>Secondary</b><span data-token="--sf-secondary"></span></span>
                <span class="swatch"><i style="--color:var(--sf-accent)"></i><b>Accent</b><span data-token="--sf-accent"></span></span>
              </div>
            </div>

            <div class="pick-wrap">
              <button class="like-btn" data-like="${key}">I Like This One</button>
            </div>
          </div>
        </div>`;
      return panel;
    }

    function setVars(el, vars) {
      Object.entries(vars).forEach(([k,v]) => el.style.setProperty(k, v));
    }

    function applyToPanel(panelKey) {
      const panel = stageEl.querySelector(`.preview-panel[data-key="${panelKey}"] .composition`);
      if (!panel) return;
      const mix = {
        colors: directions[state.colors].colors,
        typography: directions[state.typography].typography,
        vibe: directions[state.vibe].vibe,
        layout: directions[state.layout].layout
      };
      setVars(panel, mix.colors); setVars(panel, mix.typography); setVars(panel, mix.vibe); setVars(panel, mix.layout);
      const glow = directions[state.colors].tabGlow;
      document.documentElement.style.setProperty('--tab-glow', glow);
      const rootGradient = directions[state.colors].colors['--sf-primary-gradient'];
      document.documentElement.style.setProperty('--sf-primary-gradient', rootGradient);

      panel.querySelectorAll('[data-token]').forEach(el => {
        const token = el.getAttribute('data-token');
        el.textContent = directions[state.colors].colors[token] || '';
      });
    }

    function refreshTabs() {
      tabsEl.querySelectorAll('.tab').forEach(btn => btn.classList.toggle('active', btn.dataset.key === state.active));
    }

    function renderSummary() {
      summary.textContent = `Base: ${state.base ? directions[state.base].name : 'Not selected'} | Colors: ${directions[state.colors].name} | Typography: ${directions[state.typography].name} | Vibe: ${directions[state.vibe].name} | Layout: ${directions[state.layout].name}`;
    }

    function showMixer() {
      state.panelVisible = true;
      mixer.classList.add('visible');
    }

    function syncSelects() {
      ['colors','typography','vibe','layout'].forEach(id => document.getElementById(id).value = state[id]);
      renderSummary();
    }

    function setActive(key) {
      state.active = key;
      stageEl.querySelectorAll('.preview-panel').forEach(p => p.classList.toggle('active', p.dataset.key === key));
      refreshTabs();
      if (!state.base) {
        state.colors = state.typography = state.vibe = state.layout = key;
        syncSelects();
      }
      applyToPanel(key);
    }

    function copyTokens() {
      const payload = {
        base: state.base ? directions[state.base].name : null,
        selections: {
          colors: directions[state.colors].name,
          typography: directions[state.typography].name,
          vibe: directions[state.vibe].name,
          layout: directions[state.layout].name
        },
        tokens: {
          ...directions[state.colors].colors,
          ...directions[state.typography].typography,
          ...directions[state.vibe].vibe,
          ...directions[state.layout].layout
        }
      };
      navigator.clipboard.writeText(JSON.stringify(payload, null, 2)).then(() => {
        const btn = document.getElementById('copyTokens');
        const old = btn.textContent;
        btn.textContent = '✅ Copied';
        setTimeout(() => btn.textContent = old, 1200);
      });
    }

    function boot() {
      tabsEl.innerHTML = order.map(key => `<button class="tab${key === state.active ? ' active' : ''}" data-key="${key}">${directions[key].name}</button>`).join('');
      stageEl.innerHTML = '';
      order.forEach(key => stageEl.appendChild(makePanel(key)));

      ['colors','typography','vibe','layout'].forEach(id => {
        const sel = document.getElementById(id);
        sel.innerHTML = order.map(key => `<option value="${key}">${directions[key].name}</option>`).join('');
        sel.addEventListener('change', e => {
          state[id] = e.target.value;
          applyToPanel(state.active);
          renderSummary();
        });
      });

      tabsEl.addEventListener('click', e => {
        const btn = e.target.closest('.tab');
        if (!btn) return;
        setActive(btn.dataset.key);
      });

      stageEl.addEventListener('click', e => {
        if (e.target.closest('.customize')) showMixer();
        const like = e.target.closest('[data-like]');
        if (!like) return;
        const k = like.dataset.like;
        state.base = k;
        state.colors = state.typography = state.vibe = state.layout = k;
        setActive(k);
        showMixer();
        syncSelects();
      });

      document.getElementById('copyTokens').addEventListener('click', copyTokens);
      document.getElementById('collapseBtn').addEventListener('click', () => {
        state.collapsed = !state.collapsed;
        mixer.classList.toggle('collapsed', state.collapsed);
        document.getElementById('collapseBtn').textContent = state.collapsed ? 'Expand' : 'Collapse';
      });

      setActive('neon');
      applyToPanel('neon');
      syncSelects();
    }

    boot();
  </script>
</body>
</html>
